name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: pytest -q
      - run: PYTHONPATH=src python scripts/check_document_lifecycle.py
      - uses: actions/upload-artifact@v4
        with:
          name: document-lifecycle-evidence
          path: results/document-lifecycle.json
